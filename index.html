<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- PRIMARY SEO TAGS -->
    <title>PasterText | Fast, Free & Secure Text Hosting</title>
    <meta name="title" content="PasterText | Online Text Sharing & Code Paste Tool">
    <meta name="description" content="PasterText is the fastest way to share text snippets, code, and notes online. Secure, anonymous, and free text hosting at pastertext.free.nf. Better than Pastebin.">
    
    <!-- 100+ KEYWORD CLOUD FOR SEO TRAFFIC -->
    <meta name="keywords" content="paster, text, pastertext, pastebin, paste, share text, text host, code share, online notepad, private paste, secure text, snippet, dev tools, text drop, note share, simple paste, pastertext free, anonymous text, fast paste, text link, web paste, cloud text, copy paste online, paster app, text storage, temporary text, coding snippets, script host, pastertext.free.nf, paster tool, text sharing site, free pastebin alternative, text notes, developer snippets, instant text link, clipboard online, text relay, paster site, global text share, secure snippet, raw text, plain text host, online code editor, shareable links, paster script, text database, open paste, quick note, paster pro, text locker, digital notes, web notepad, paste link, text to link, code bin, paster portal, text dash, quick text, easy paste, paster hub, text vault, snippet bin, code vault, dev paste, text publish, online draft, text archive, paster engine, text flow, paster net, text space, paster core, snippet storage, code relay, text sync, paster plus, secure notes online, encrypted text share, paster world, text direct, instant pastebin, paster base, text zone, code bucket, paster box, text pile, snippet club, paster link, text spot, paster point, text wave, paster light, quick snippets, code keeper, paste text online, share snippets, anonymous pastebin, text uploader, link creator">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #22d3ee;
            --bg: #030712;
            --card-bg: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(168, 85, 247, 0.15) 0%, transparent 50%);
        }

        .container { max-width: 900px; width: 92%; margin: 40px auto; flex: 1; }

        header { text-align: center; margin-bottom: 40px; }
        
        .status-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(34, 211, 238, 0.1); color: var(--accent);
            padding: 6px 16px; border-radius: 50px; font-size: 0.8rem;
            margin-bottom: 20px; border: 1px solid rgba(34, 211, 238, 0.2);
        }
        .status-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .brand { 
            font-size: 3rem; font-weight: 800; letter-spacing: -1px;
            background: linear-gradient(to right, #fff, var(--primary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 24px;
            padding: 30px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        textarea {
            width: 100%; min-height: 350px; background: rgba(0,0,0,0.3);
            border: 1px solid var(--border); border-radius: 16px; padding: 20px;
            color: var(--text); font-size: 1rem; line-height: 1.7; outline: none;
            resize: none; transition: 0.3s;
        }
        textarea:focus { border-color: var(--primary); }

        .btn-group { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
        .btn {
            padding: 14px 24px; border-radius: 12px; border: none; cursor: pointer;
            font-weight: 600; display: flex; align-items: center; gap: 10px;
            transition: 0.3s; text-transform: uppercase; font-size: 0.8rem;
        }
        .btn-main { background: var(--primary); color: white; }
        .btn-main:hover { transform: translateY(-2px); opacity: 0.9; }
        
        .btn-outline { background: rgba(255,255,255,0.05); color: white; border: 1px solid var(--border); }

        #result-area {
            margin-top: 25px; padding: 20px; border-radius: 16px;
            background: rgba(99, 102, 241, 0.1); border: 1px dashed var(--primary);
            display: none; flex-direction: column; gap: 15px;
        }

        .url-box {
            background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px;
            font-family: monospace; text-align: center; word-break: break-all;
            color: var(--accent); border: 1px solid var(--border); font-size: 0.95rem;
        }

        .view-content {
            background: rgba(0,0,0,0.3); padding: 25px; border-radius: 16px;
            white-space: pre-wrap; margin-bottom: 20px; border: 1px solid var(--border);
            max-height: 60vh; overflow-y: auto; line-height: 1.8;
        }

        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--accent); color: #000; padding: 10px 25px; border-radius: 50px;
            font-weight: 700; display: none; z-index: 1000; box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        footer { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.8rem; }
        .hidden { display: none !important; }
        .loader { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-bottom-color: #fff; border-radius: 50%; display: none; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="mesh-bg"></div>

    <div class="container">
        <header>
            <div class="status-badge"><div class="status-dot"></div> pastertext.free.nf is LIVE</div>
            <h1 class="brand">PasterText</h1>
            <p class="tagline">Fastest anonymous text sharing at pastertext.free.nf</p>
        </header>

        <!-- CREATE MODE -->
        <main id="create-section">
            <div class="glass-card">
                <textarea id="text-input" placeholder="Paste your text or code here..."></textarea>
                <div class="btn-group">
                    <button id="generate-btn" class="btn btn-main">
                        <span class="loader" id="btn-loader"></span>
                        <i class="fa-solid fa-bolt"></i> Generate Link
                    </button>
                    <button id="clear-btn" class="btn btn-outline">
                        <i class="fa-solid fa-eraser"></i> Clear
                    </button>
                </div>

                <div id="result-area">
                    <p style="text-align: center; font-weight: 600; color: var(--accent);">✔ Link Ready!</p>
                    <div class="url-box" id="display-url"></div>
                    <button id="copy-link-btn" class="btn btn-main" style="width: 100%; justify-content: center;">
                        <i class="fa-solid fa-copy"></i> Copy Link
                    </button>
                </div>
            </div>
        </main>

        <!-- VIEW MODE -->
        <main id="view-section" class="hidden">
            <div class="glass-card">
                <div id="shared-text" class="view-content"></div>
                <div class="btn-group">
                    <button id="copy-text-btn" class="btn btn-main">
                        <i class="fa-solid fa-copy"></i> Copy Text
                    </button>
                    <button id="download-btn" class="btn btn-outline">
                        <i class="fa-solid fa-download"></i> Save .txt
                    </button>
                    <button onclick="location.hash=''; location.reload();" class="btn btn-outline">
                        <i class="fa-solid fa-plus"></i> New
                    </button>
                </div>
            </div>
        </main>

        <!-- 404 SECTION -->
        <main id="error-section" class="hidden">
            <div class="glass-card" style="text-align: center;">
                <i class="fa-solid fa-bug" style="font-size: 3rem; color: var(--secondary); margin-bottom: 20px;"></i>
                <h2>Paste Not Found</h2>
                <button onclick="location.hash=''" class="btn btn-main" style="margin: 20px auto;">Back to Home</button>
            </div>
        </main>
    </div>

    <footer>
        <p>&copy; 2026 PASTERTEXT &bull; PURE PRIVACY &bull; pastertext.free.nf</p>
    </footer>

    <div id="toast" class="toast">COPIED!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
  apiKey: "AIzaSyDqAbDUFWOkKDEsFohiU_0-Q4WUzHmmuRk",
  authDomain: "text-test-6c3a4.firebaseapp.com",
  databaseURL: "https://text-test-6c3a4-default-rtdb.firebaseio.com",
  projectId: "text-test-6c3a4",
  storageBucket: "text-test-6c3a4.firebasestorage.app",
  messagingSenderId: "882971912145",
  appId: "1:882971912145:web:81e86732f4da4571dae2f0"
};

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const textInput = document.getElementById('text-input');
        const generateBtn = document.getElementById('generate-btn');
        const resultArea = document.getElementById('result-area');
        const displayUrl = document.getElementById('display-url');
        const sharedTextDiv = document.getElementById('shared-text');
        const toast = document.getElementById('toast');

        // FIXED COPY FUNCTION (Browser Friendly)
        async function copyToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                try {
                    await navigator.clipboard.writeText(text);
                    showToast();
                } catch (err) {
                    fallbackCopy(text);
                }
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            textArea.style.top = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast();
            } catch (err) {
                alert("Please copy manually: " + text);
            }
            document.body.removeChild(textArea);
        }

        function showToast() {
            toast.style.display = 'block';
            setTimeout(() => toast.style.display = 'none', 2000);
        }

        generateBtn.addEventListener('click', async () => {
            const content = textInput.value.trim();
            if(!content) return;

            const id = Math.random().toString(36).substring(2, 8);
            const loader = document.getElementById('btn-loader');
            generateBtn.disabled = true;
            loader.style.display = 'inline-block';

            try {
                await set(ref(db, 'drops/' + id), { content, time: Date.now() });
                // Bug fix for URL generation
                const url = window.location.href.split('#')[0] + '#' + id;
                displayUrl.innerText = url;
                resultArea.style.display = 'flex';
                resultArea.scrollIntoView({ behavior: 'smooth' });
            } catch (e) {
                alert("Database Error!");
            } finally {
                generateBtn.disabled = false;
                loader.style.display = 'none';
            }
        });

        const handleRoute = async () => {
            const id = window.location.hash.substring(1);
            document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));

            if(!id) {
                document.getElementById('create-section').classList.remove('hidden');
                return;
            }

            try {
                const snap = await get(ref(db, 'drops/' + id));
                if(snap.exists()) {
                    sharedTextDiv.innerText = snap.val().content;
                    document.getElementById('view-section').classList.remove('hidden');
                } else {
                    document.getElementById('error-section').classList.remove('hidden');
                }
            } catch (e) {
                document.getElementById('error-section').classList.remove('hidden');
            }
        };

        window.addEventListener('hashchange', handleRoute);
        window.addEventListener('load', handleRoute);

        document.getElementById('copy-link-btn').addEventListener('click', () => copyToClipboard(displayUrl.innerText));
        document.getElementById('copy-text-btn').addEventListener('click', () => copyToClipboard(sharedTextDiv.innerText));

        document.getElementById('download-btn').addEventListener('click', () => {
            const blob = new Blob([sharedTextDiv.innerText], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `PasterText_${window.location.hash.substring(1)}.txt`;
            a.click();
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            textInput.value = '';
            resultArea.style.display = 'none';
        });
    </script>
</body>
</html>
